server {
    server_name deergpt.ru www.deergpt.ru 85.208.85.170;

    root /var/www/deergpt;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML всегда сверяется с сервером — после выкладки посетители сразу получают новую версию
    location ~* \.html?$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 25M;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/deergpt.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/deergpt.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.deergpt.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = deergpt.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name deergpt.ru www.deergpt.ru 85.208.85.170;
    return 404; # managed by Certbot




}